name: Build

# Runs the tests and lint and builds the APKs for every push and pull request
# that changes the app or its build, see paths below; changes to the docs
# alone don't run it. "Run workflow" on the Actions tab runs it on any branch.
# The version is the next release computed from the tags, see publish.sh,
# with the run number: <next release>-build.<run number>, e.g. 3.1.0-build.42.
# The version code is the run number, so that each build updates the one
# before. Keep the name of this file: GitHub counts the run numbers per
# workflow file, and a renamed one starts at 1 again. Releases are made with
# the Publish workflow, see publish.yml.
#
# The debug APK is uploaded for testing, as Passdroid_v<version>_debug.apk,
# not zipped. It installs next to the release app, see app/build.gradle. It
# is signed with the debug key in the secret DEBUG_KEYSTORE_BASE64, so that
# it can update the APK of an earlier run, see "Debug signing key" in
# INTERNALS.md. Without the secret, e.g. in pull requests from forks, it is
# signed with a key generated for the run, and can not update the APK of
# another run.
on:
  push:
    branches: ['**']
    # The inputs of the build: only a change to one of them starts a run.
    # Add a new one here, e.g. a gradle.properties or another module.
    paths: &build-inputs
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradlew'
      - 'publish.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths: *build-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, to compute the version
          fetch-depth: 0

      - name: Compute version
        run: |
          if ! NEXT=$(./publish.sh version -p false); then
            echo "$NEXT"
            echo "::error::Could not compute the version"
            exit 1
          fi
          echo "VERSION=$NEXT-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "ORG_GRADLE_PROJECT_debugKeystore=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::The secret DEBUG_KEYSTORE_BASE64 is not set: the debug APK is signed with a key generated for this run, and can not update the APK of another run"
          fi

      # The release build checks that shrinking the code keeps what the app
      # needs
      - name: Build and test
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Summary
        run: echo "### Passdroid++ $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Name the debug APK
        run: |
          mkdir -p app/build/ci
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/ci/Passdroid_v${VERSION}_debug.apk"

      # Uploaded as it is, so it downloads as the APK. The artifact is named
      # after the file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: app/build/ci/Passdroid_v${{ env.VERSION }}_debug.apk
          archive: false
          if-no-files-found: error
