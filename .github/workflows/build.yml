name: Build

# Runs the tests and lint and builds the APKs for every push and pull request.
# The version is the default of local builds, see app/build.gradle. Releases
# are made with the Publish workflow, see publish.yml.
#
# The debug APK is uploaded for testing. It is signed with a debug key that
# is generated for each run, so it can not update the APK of another run.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"

      # The release build checks that shrinking the code keeps what the app
      # needs
      - name: Build and test
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passdroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
