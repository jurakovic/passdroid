name: Publish

# Builds, signs and releases Passdroid++, see publish.sh. Run it from the
# Actions tab ("Run workflow"):
#
# - The version is computed from the latest v3.x.y tag: master gives the
#   next release (3.0.1), other branches the next preview (3.0.1-preview.1).
#   Bump Type picks the part that is increased; Version overrides it all.
# - The version code is the number of the run of this workflow, which only
#   grows. Renaming this file starts it at 1 again, and Android does not
#   install an update with a lower version code, so keep the name.
# - The release is tagged v<version> on the built commit and published on
#   GitHub with the APK and its SHA-256 checksum. Previews are marked as
#   pre-releases.
#
# The APK is signed with the key from these repository secrets:
#   RELEASE_KEYSTORE_BASE64    the keystore file, base64 encoded
#   RELEASE_KEYSTORE_PASSWORD  password of the keystore
#   RELEASE_KEY_ALIAS          alias of the signing key, only needed if the
#                              keystore contains more than one key
#   RELEASE_KEY_PASSWORD       password of the key, if it differs from the
#                              keystore password
#
# GitHub hides the values of secrets everywhere in the logs, so a secret must
# not be a word that appears in them, like "passdroid".

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Step 1: Build'
        required: false
        default: true
        type: boolean
      package:
        description: 'Step 2: Package'
        required: false
        default: true
        type: boolean
      release:
        description: 'Step 3: Release'
        required: false
        default: true
        type: boolean
      source_branch:
        description: 'Source branch (branch to build from, "auto" uses workflow ref)'
        required: false
        default: 'auto'
        type: string
      version:
        description: 'Version (leave empty or "auto" to compute from last tag)'
        required: false
        default: 'auto'
        type: string
      version_code:
        description: 'Version code (leave empty or "auto" to use the run number)'
        required: false
        default: 'auto'
        type: string
      bump_type:
        description: 'Bump Type (ignored when version is explicit)'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch
      base_ver:
        description: 'Major version stream (tags outside this major are ignored)'
        required: false
        default: '3'
        type: string
      preview:
        description: 'Preview release (auto = follows branch: non-master → true, master → false)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 'true'
          - 'false'

permissions:
  contents: read

# Two releases at once could compute the same version
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}

    env:
      SOURCE_BRANCH: ${{ inputs.source_branch == 'auto' && github.ref_name || inputs.source_branch }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_branch == 'auto' && github.ref || inputs.source_branch }}
          fetch-depth: 0

      - name: Fetch publish.sh
        if: ${{ inputs.source_branch != 'auto' }}
        run: git restore --source "origin/$GITHUB_REF_NAME" -- publish.sh

      - name: Compute Version
        id: ver
        env:
          INPUT_BUILD: ${{ inputs.build }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_BUMP_TYPE: ${{ inputs.bump_type }}
          INPUT_BASE_VER: ${{ inputs.base_ver }}
          INPUT_PREVIEW: ${{ inputs.preview }}
        run: |
          if [ "$INPUT_RELEASE" = true ] && { [ "$INPUT_BUILD" != true ] || [ "$INPUT_PACKAGE" != true ]; }; then
            echo "::error::Step 3 (Release) needs steps 1 (Build) and 2 (Package)"
            exit 1
          fi

          chmod +x ./publish.sh
          if ! VERSION=$(GITHUB_REF_NAME="$SOURCE_BRANCH" ./publish.sh version -v "$INPUT_VERSION" -b "$INPUT_BUMP_TYPE" -M "$INPUT_BASE_VER" -p "$INPUT_PREVIEW"); then
            echo "$VERSION"
            echo "::error::Could not compute the version"
            exit 1
          fi

          VERSION_CODE="$INPUT_VERSION_CODE"
          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" = auto ]; then
            VERSION_CODE="$GITHUB_RUN_NUMBER"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build
        if: ${{ inputs.build }}
        run: GITHUB_REF_NAME="$SOURCE_BRANCH" ./publish.sh build -v "$VERSION" -c "$VERSION_CODE" -u true

      - name: Package
        if: ${{ inputs.package }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::No signing key is configured. Add the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets, see .github/workflows/publish.yml."
            exit 1
          fi

          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          GITHUB_REF_NAME="$SOURCE_BRANCH" ./publish.sh package -v "$VERSION" -c "$VERSION_CODE" -u true

          {
            echo "### Passdroid++ $VERSION"
            echo
            echo "- Version code: $VERSION_CODE"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- SHA-256 of the APK: \`$(cut -d ' ' -f 1 release/checksums.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifacts
        if: ${{ inputs.package }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passdroid-${{ env.VERSION }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit that was built, even if the branch moved since
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0

      - name: Fetch publish.sh
        if: ${{ inputs.source_branch != 'auto' }}
        run: git restore --source "origin/$GITHUB_REF_NAME" -- publish.sh

      - name: Download All Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: passdroid-${{ needs.build.outputs.version }}
          path: release

      - name: Git Tag
        run: |
          chmod +x ./publish.sh
          ./publish.sh release -v "$VERSION" -u true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "v$VERSION" release/* \
            --verify-tag \
            --title "Passdroid++ $VERSION" \
            --generate-notes \
            "${prerelease[@]}"
